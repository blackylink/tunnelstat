[package]
name = "tunnelstat"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A 343 KB Windows overlay showing live VPN tunnel speed and connection health. No driver, no admin, zero network traffic."
license = "MIT"
repository = "https://github.com/blackylink/tunnelstat"
homepage = "https://github.com/blackylink/tunnelstat"
keywords = [
    "vpn", "overlay", "network-monitor", "traffic", "tunnel", "sing-box",
    "xray", "clash", "wireguard", "leak-detection", "windows", "gdi", "tray",
]
categories = ["network-programming", "visualization", "command-line-utilities"]
readme = "README.md"

# Один файл — это главная фича проекта: никаких зависимостей, которые тащатся рядом.
[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
